[misc]
# Don't ask for confirmation before each update.
assume_yes = true

# Cache sudo credentials upfront.
pre_sudo = true

# Clean up temporary/old files.
cleanup = true

# Allow retries.
no_retry = false

# Don't print hundreds of skipped steps.
show_skipped = false

# Only notify when something fails.
notify_end = "on_failure"

# Prefer nh for Home Manager/Nix when available.
nix_handler = "autodetect"

# Disable things we don't want Topgrade managing.
disable = [
  "nix",
  "snap",
  "firmware",
]


[linux]
# Use Garuda's normal system update mechanism.
arch_package_manager = "garuda_update"

# Show relevant Arch news during upgrades.
show_arch_news = true

# Home Manager flake.
home_manager_arguments = [
  "--flake",
  "/home/commander/dotfiles/home-manager#commander"
]


[git]
# Automatically update the dotfiles repository.
repos = [
  "~/dotfiles",
]

max_concurrency = 5

# Rebase remote changes and temporarily stash local edits.
arguments = "--rebase --autostash"


[flatpak]
# Update per-user Flatpaks.
use_sudo = false


[python]
# Update pip-installed packages through pip-review.
enable_pip_review = true


[cargo]
# Check Cargo packages installed from Git as well.
git = true

quiet = false


[rustup]
# Keep stable Rust updated.
channels = [
  "stable",
]


[go]
# Update Go-installed tools through gup.
gup_exclude = []


[vscode]
# Use the default VS Code profile.
profile = ""
