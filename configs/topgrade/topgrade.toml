[misc]
# Don't ask for confirmation before each update.
assume_yes = true

# Cache sudo credentials upfront.
pre_sudo = true

# Clean up temporary/old files.
cleanup = true

# Allow retries.
no_retry = false

# Don't print hundreds of skipped steps.
show_skipped = false

# Only notify when something fails.
notify_end = "on_failure"

# Nix itself is upgraded with Home Manager below, not as its own step.
disable = [
  "nix",
  "snap",
  "firmware",
]


[linux]
# Use Garuda's normal system update mechanism.
arch_package_manager = "garuda_update"

# Show relevant Arch news during upgrades.
show_arch_news = true

# Home Manager flake.
home_manager_arguments = [
  "--flake",
  @HOME_MANAGER_FLAKE@
]


[git]
# Automatically update the dotfiles repository.
repos = [
  @DOTFILES_DIRECTORY@,
]

max_concurrency = 5

# Rebase remote changes and temporarily stash local edits.
arguments = "--rebase --autostash"


[flatpak]
# Update per-user Flatpaks.
use_sudo = false


[cargo]
# Check Cargo packages installed from Git as well.
git = true

quiet = false


[rustup]
# Keep stable Rust updated.
channels = [
  "stable",
]
