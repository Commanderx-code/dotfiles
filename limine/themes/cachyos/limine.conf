# Boot menu appearance for Limine, merged into the global section of the
# machine's limine.conf by restore-limine. The "/" entries below that section,
# which the Limine entry tool manages on CachyOS, are never touched.
#
# The look is the CachyOS Limine theme by diegons490 (wallpaper and colours),
# with a two-second menu like the GRUB settings in grub/.
timeout: 2
wallpaper: boot():/dotfiles-splash.png
wallpaper_style: stretched
term_palette: 1e1e2e;f38ba8;a6e3a1;f9e2af;89b4fa;f5c2e7;94e2d5;cdd6f4
term_palette_bright: 585b70;f38ba8;a6e3a1;f9e2af;89b4fa;f5c2e7;94e2d5;cdd6f4
term_background: ffffffff
term_foreground: cdd6f4
term_background_bright: ffffffff
term_foreground_bright: cdd6f4
interface_branding:
