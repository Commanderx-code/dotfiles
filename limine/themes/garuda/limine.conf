# Boot menu appearance for Limine in the Garuda dr460nized look: the wallpaper
# and colours of Garuda's GRUB theme (grey entries, cyan selection), with a
# two-second menu. Merged into the global section of limine.conf by
# restore-limine; the "/" boot entries are never touched.
timeout: 2
wallpaper: boot():/dotfiles-splash.png
wallpaper_style: stretched
term_background: ffffffff
term_foreground: cccccc
term_background_bright: ffffffff
term_foreground_bright: 02ccfc
interface_branding_colour: 02ccfc
interface_branding:
