name: Validate dotfiles
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write # purge superseded Nix caches
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      # Keep the Nix store between runs, so unchanged packages are not rebuilt.
      # Only main saves: a cache saved from another branch is not shared and
      # would crowd main's out of the repository's cache quota. Purging is
      # main-only too: Dependabot's runs have a read-only token.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          save: ${{ github.ref == 'refs/heads/main' }}
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-primary-key: never
      - name: Validate and build without activation
        run: nix develop ./home-manager --command ./scripts/check --build
