name: Sync shared Fish from Myfish
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Validate dotfiles']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: sync-myfish-main
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'Commanderx-code/dotfiles' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Import only a tested Myfish revision
        id: import
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/sync-myfish.py
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        if: steps.import.outputs.changed == 'true'
      # Keep the Nix store between runs, so unchanged packages are not rebuilt.
      # Only main saves: a cache saved from another branch is not shared and
      # would crowd main's out of the repository's cache quota. Purging is
      # main-only too: Dependabot's runs have a read-only token.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        if: steps.import.outputs.changed == 'true'
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          save: ${{ github.ref == 'refs/heads/main' }}
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-primary-key: never
      - name: Test and build the combined workstation configuration
        if: steps.import.outputs.changed == 'true'
        run: nix develop ./home-manager --command ./scripts/check --build
      - name: Publish the tested import
        if: steps.import.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add configs/fish/functions configs/fish/conf.d configs/fish/shared-source.json configs/starship/starship.toml
          git diff --cached --check
          git commit -m 'Sync tested shared Fish and prompt from Myfish'
          git push origin HEAD:main
      - name: Ensure the published commit receives its own validation
        env:
          GH_TOKEN: ${{ github.token }}
        # GITHUB_TOKEN pushes do not trigger push workflows. Retrying this step
        # on no-change runs also recovers an interrupted post-push dispatch.
        run: python3 -B scripts/sync-myfish.py --ensure-validation
